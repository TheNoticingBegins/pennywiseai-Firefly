name: Release

on:
  workflow_dispatch:
    inputs:
      use_existing_tag:
        description: 'Use latest existing tag (e.g. v1.3.1) and attach built APKs to a draft release. Recommended.'
        required: false
        default: true
        type: boolean
      create_as_draft:
        description: 'Create the GitHub Release as a draft (you can publish later)'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry run - preview only, do not build or release'
        required: false
        default: false
        type: boolean

jobs:
  build-release:
    name: Build Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ inputs.use_existing_tag }}" = "true" ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            VERSION="${TAG#v}"
            if [ -z "$VERSION" ]; then
              VERSION=$(grep 'versionName = "' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
            fi
          else
            VERSION=$(grep 'versionName = "' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version: $VERSION"

      - name: Decode signing keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "Keystore configured for signing"
          else
            echo "No KEYSTORE_BASE64 secret - producing unsigned release APKs"
          fi

      - name: Build release APKs
        if: ${{ !inputs.dry_run }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Standard flavor (full ABI split + universal, signed if keystore present)
          if [ -f "app/release.keystore" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "Building signed standard release..."
            ./gradlew assembleStandardRelease \
              -Pandroid.injected.signing.store.file=${{ github.workspace }}/app/release.keystore \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD
          else
            echo "Building unsigned standard release..."
            ./gradlew assembleStandardRelease
          fi

          # F-Droid flavor (unsigned by design)
          echo "Building F-Droid release..."
          ./gradlew assembleFdroidRelease

      - name: Prepare release artifacts
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STANDARD_DIR="app/build/outputs/apk/standard/release"
          FDROID_DIR="app/build/outputs/apk/fdroid/release"

          # Rename standard APKs
          for f in "$STANDARD_DIR"/*-release*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            newname=$(echo "$base" | sed -E "s/app-standard-(.*)-release(.*).apk/PennyWise-v${VERSION}-\1\2.apk/")
            mv "$f" "$STANDARD_DIR/$newname" 2>/dev/null || true
          done

          # Rename F-Droid APK
          if [ -f "$FDROID_DIR/app-fdroid-release-unsigned.apk" ]; then
            mv "$FDROID_DIR/app-fdroid-release-unsigned.apk" \
               "$FDROID_DIR/PennyWise-fdroid-v${VERSION}.apk"
          fi

          # Generate SHA256 sums
          cd "$STANDARD_DIR"
          for apk in PennyWise-v${VERSION}*.apk; do
            [ -f "$apk" ] && sha256sum "$apk" > "${apk}.sha256"
          done

          cd "$GITHUB_WORKSPACE/$FDROID_DIR"
          if [ -f "PennyWise-fdroid-v${VERSION}.apk" ]; then
            sha256sum "PennyWise-fdroid-v${VERSION}.apk" > "PennyWise-fdroid-v${VERSION}.apk.sha256"
          fi

      - name: Generate release notes
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "# PennywiseAI-Firefly v$VERSION" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "> This is a vibe-coded personal fork of Pennywise AI with deep Firefly III integration." >> RELEASE_NOTES.md
          echo "> Probably shouldn't be used by anyone without review." >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          # Extract the matching section from CHANGELOG.md if present
          if [ -f CHANGELOG.md ]; then
            awk -v ver="v$VERSION" '
              /^## \[/ { 
                if (found) exit; 
                if ($0 ~ ver) { found=1; print; next } 
              } 
              found { print }
            ' CHANGELOG.md >> RELEASE_NOTES.md || true
          fi

          if [ ! -s RELEASE_NOTES.md ] || [ $(wc -l < RELEASE_NOTES.md) -lt 8 ]; then
            echo "## Changes" >> RELEASE_NOTES.md
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              git log $LAST_TAG..HEAD --pretty=format:"- %s" >> RELEASE_NOTES.md
            fi
          fi

          echo "" >> RELEASE_NOTES.md
          echo "### Downloads" >> RELEASE_NOTES.md
          echo "- **Standard** (recommended): PennyWise-v${VERSION}-universal.apk" >> RELEASE_NOTES.md
          echo "- **F-Droid**: PennyWise-fdroid-v${VERSION}.apk (unsigned)" >> RELEASE_NOTES.md

      - name: Create GitHub Release (draft)
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PennywiseAI-Firefly v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: ${{ inputs.create_as_draft }}
          prerelease: false
          files: |
            app/build/outputs/apk/standard/release/PennyWise-v${{ steps.version.outputs.version }}*.apk
            app/build/outputs/apk/standard/release/PennyWise-v${{ steps.version.outputs.version }}*.apk.sha256
            app/build/outputs/apk/fdroid/release/PennyWise-fdroid-v${{ steps.version.outputs.version }}.apk
            app/build/outputs/apk/fdroid/release/PennyWise-fdroid-v${{ steps.version.outputs.version }}.apk.sha256

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN - would create draft for v${{ steps.version.outputs.version }}"
          cat RELEASE_NOTES.md || true

      - name: Cleanup
        if: always()
        run: |
          rm -f app/release.keystore || true
